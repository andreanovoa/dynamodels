[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamodels"
version = "0.2.1"
description = "Dynamical-system models with history tracking and pluggable integrators (Lorenz, Van der Pol, Rijke, annular combustor, KS)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Andrea Nóvoa", email = "a.novoa@imperial.ac.uk"}
]
keywords = ["dynamical-systems", "chaos", "thermoacoustics", "reduced-order-modelling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "matplotlib>=3.9,<4.0",
    "multiprocess>=0.70",
    "numpy>=2.0,<3.0",
    "scipy>=1.13,<2.0",
    "typeguard",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/andreanovoa/dynamodels"
Repository = "https://github.com/andreanovoa/dynamodels"
Issues = "https://github.com/andreanovoa/dynamodels/issues"

[tool.setuptools]
packages = ["dynamodels", "dynamodels.physical"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "N802", "N803", "N806", "N815",  # DA notation: Nq, Nphi, M, dt_ESN, ...
]
