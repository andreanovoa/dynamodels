name: docs

on:
  push:
    branches: [main]

permissions:
  contents: write   # push to gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material "mkdocstrings[python]" nbconvert
      - run: python -m nbconvert --to html tutorial_*.ipynb --output-dir docs/tutorials
      - run: mkdocs gh-deploy --force
