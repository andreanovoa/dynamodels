# Releasing: bump version in pyproject.toml AND dynamodels/__init__.py, commit,
# then tag that commit: git tag vX.Y.Z && git push --tags. This workflow
# builds the tagged tree and publishes it to PyPI (trusted publishing).
name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
